<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעיין חי - תלמידים</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #1a237e; --s: #00bcd4; --bg: #f4f7f9; --success: #2ecc71; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        header { background: var(--p); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--s); }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 15px; border-right: 5px solid var(--s); }
        .task-title { color: var(--p); font-weight: bold; font-size: 1.2rem; display: block; }
        .task-desc { color: #555; margin: 10px 0; display: block; }
        .status-badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 10px; background: #eee; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-done { background: var(--success); color: white; }
        .btn-done:disabled { background: #ccc; cursor: not-allowed; }
        .login-link { text-align: center; margin-top: 30px; color: var(--p); cursor: pointer; text-decoration: underline; }
        
        #login-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <h1>מעיין חי</h1>
    <p>לוח משימות תלמידים</p>
</header>

<div class="container">
    <h2 id="no-tasks" style="text-align: center; color: #999; margin-top: 50px; display: none;">אין שיעורי בית כרגע... 🎉</h2>
    <div id="tasks-container"></div>
    
    <div class="login-link" onclick="document.getElementById('login-modal').style.display='flex'">כניסת מורה</div>
</div>

<div id="login-modal">
    <div class="modal-content">
        <h3 style="margin-top:0">כניסת צוות</h3>
        <input type="text" id="tName" placeholder="שם המורה">
        <input type="password" id="tCode" placeholder="קוד סודי">
        <button class="btn btn-done" style="background:var(--p)" onclick="doLogin()">התחבר</button>
        <button class="btn" onclick="document.getElementById('login-modal').style.display='none'">ביטול</button>
    </div>
</div>

<script>
    const channel = new BroadcastChannel('maayan_chai_system');

    function loadTasks() {
        const container = document.getElementById('tasks-container');
        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        
        if (tasks.length === 0) {
            document.getElementById('no-tasks').style.display = 'block';
            container.innerHTML = '';
            return;
        }
        
        document.getElementById('no-tasks').style.display = 'none';
        container.innerHTML = tasks.map((task, index) => `
            <div class="card">
                <span class="task-title">${task.subject}</span>
                <span class="task-desc">${task.content}</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="text" id="student-${index}" placeholder="שמך המלא" style="margin:0; flex: 2;">
                    <button class="btn btn-done" style="margin:0; flex: 1;" onclick="markAsDone(${index})">סיימתי!</button>
                </div>
            </div>
        `).join('');
    }

    function markAsDone(taskIndex) {
        const studentName = document.getElementById(`student-${taskIndex}`).value;
        if (!studentName) return alert("אנא הכנס שם לפני האישור");

        const tasks = JSON.parse(localStorage.getItem('tasks'));
        const report = {
            student: studentName,
            subject: tasks[taskIndex].subject,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };

        let reports = JSON.parse(localStorage.getItem('reports')) || [];
        reports.push(report);
        localStorage.setItem('reports', JSON.stringify(reports));

        channel.postMessage({ type: 'REPORT_SUBMITTED', report });

        alert("כל הכבוד! הדיווח נשלח למורה.");
        document.getElementById(`student-${taskIndex}`).disabled = true;
    }

    function doLogin() {
        if(document.getElementById('tName').value === "הרב חיים מפעי" && document.getElementById('tCode').value === "8114") {
            window.location.href = 'teacher.html';
        } else { alert("פרטים שגויים"); }
    }

    channel.onmessage = (e) => { if(e.data.type === 'NEW_TASK') loadTasks(); };

    window.onload = loadTasks;
</script>
</body>
</html>
