<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעיין חי - ניהול מורה</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #1a237e; --s: #4caf50; }
        body { font-family: 'Assistant', sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { color: var(--p); margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-send { background: var(--p); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: right; border-bottom: 2px solid #eee; padding: 10px; font-size: 0.9rem; color: #666; }
        td { padding: 10px; border-bottom: 1px solid #f9f9f9; font-size: 0.9rem; }
        .clear-btn { color: red; cursor: pointer; font-size: 0.8rem; background: none; border: none; }
        .nav-btn { background: #ddd; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h2 id="welcome-msg">שלום המורה 👨‍🏫</h2>
    <button class="nav-btn" onclick="location.href='index.html'">דף תלמיד</button>
</div>

<div class="card">
    <h3>➕ פרסום משימה</h3>
    <input type="text" id="subject" placeholder="מקצוע">
    <input type="text" id="content" placeholder="תיאור המשימה">
    <button class="btn-send" onclick="addNewTask()">שלח לכל התלמידים</button>
</div>

<div class="card">
    <div style="display:flex; justify-content:space-between;">
        <h3>📊 דיווחי ביצוע (זמן אמת)</h3>
        <button class="clear-btn" onclick="clearData()">נקה הכל</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>תלמיד</th>
                <th>משימה</th>
                <th>שעה</th>
            </tr>
        </thead>
        <tbody id="report-table"></tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
    if (sessionStorage.getItem('isTeacher') !== 'true') {
        window.location.href = 'index.html';
    }

    const firebaseConfig = {
        apiKey: "AIzaSyAyeN8movOwjUFgRB-cvqB8dhzASPfIooc",
        authDomain: "mhschool-7690f.firebaseapp.com",
        databaseURL: "https://mhschool-7690f-default-rtdb.firebaseio.com",
        projectId: "mhschool-7690f",
        storageBucket: "mhschool-7690f.firebasestorage.app",
        messagingSenderId: "458018293803",
        appId: "1:458018293803:web:ae4e0206b1e4acb165c26e"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    window.onload = function() {
        const name = sessionStorage.getItem('teacherName');
        if(name) document.getElementById('welcome-msg').innerText = `שלום המורה ${name} 👨‍🏫`;
    };

    function addNewTask() {
        const subject = document.getElementById('subject').value;
        const content = document.getElementById('content').value;
        if(!subject || !content) return alert("מלא פרטים");
        database.ref('tasks').push({ subject, content, timestamp: Date.now() });
        alert("פורסם!");
        document.getElementById('subject').value = '';
        document.getElementById('content').value = '';
    }

    database.ref('reports').on('value', (snapshot) => {
        const reports = snapshot.val();
        const table = document.getElementById('report-table');
        table.innerHTML = reports ? Object.values(reports).reverse().map(r => `
            <tr><td><b>${r.student}</b></td><td>${r.subject}</td><td>${r.time}</td></tr>
        `).join('') : '';
    });

    function clearData() {
        if(confirm("למחוק הכל?")) {
            database.ref('tasks').remove();
            database.ref('reports').remove();
        }
    }
</script>
</body>
</html>
